services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: proxy
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: proxy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxy"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: registry.gitlab.com/tachiproxy/versioned-proxy/api:latest
    restart: always
    env_file:
      - .env
    # Revision payloads live on the dedicated 30gb disk mounted at
    # /data/tachiproxy (salt/tachiproxy/disk.sls); geoip/mitmproxy state
    # stays small so it's fine on the root-disk docker volumes.
    volumes:
      - /data/tachiproxy/payloads:/data/payloads
      - geoip:/data/geoip
      - mitmproxy-ca:/data/mitmproxy
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: registry.gitlab.com/tachiproxy/versioned-proxy/proxy:latest
    restart: always
    env_file:
      - .env
    volumes:
      - /data/tachiproxy/payloads:/data/payloads
      - geoip:/data/geoip
      - mitmproxy-ca:/data/mitmproxy
    ports:
      - "8070:8080"
    # Waits on the API's healthcheck, which only passes once migrations
    # (RUN_MIGRATIONS_ON_STARTUP=true, api-only) have completed.
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  geoip:
  mitmproxy-ca:
