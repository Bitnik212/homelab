services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: always
    environment:
      - discovery.type=single-node
      # Internal-only (vmbr0 LAN, no HA) log store, but Fleet refuses to
      # work at all with security off ("Kibana security must be enabled to
      # use Fleet") -- so it's on, just without the TLS auto-configuration
      # ES 8.x normally does alongside it (no other nodes to talk to over
      # transport, and HTTP is already LAN-only, so plaintext + basic auth
      # is enough here without managing self-signed certs).
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD={{ pillar['elk']['elastic_password'] }}
      # Half of vm-elk's 8gb RAM (proxmox-terraform/vm-elk.tf), leaving the
      # rest for OS page cache.
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /data/elk/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:{{ pillar['elk']['elastic_password'] }} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # kibana_system's password isn't set by ELASTIC_PASSWORD (that only
      # bootstraps the elastic superuser) -- salt/elk/app.sls sets it via
      # the security API once Elasticsearch is up, to this same value.
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD={{ pillar['elk']['kibana_password'] }}
      # Pinned so Fleet's encrypted saved objects (agent policies,
      # enrollment tokens) and sessions survive a container restart instead
      # of Kibana generating -- and losing -- new keys every time.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY={{ pillar['elk']['encryptedsavedobjects_key'] }}
      - XPACK_SECURITY_ENCRYPTIONKEY={{ pillar['elk']['security_encryption_key'] }}
      - XPACK_REPORTING_ENCRYPTIONKEY={{ pillar['elk']['reporting_encryption_key'] }}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
