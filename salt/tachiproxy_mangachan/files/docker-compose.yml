services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Root disk has no dedicated data volume for this (unlike postgres_data's
    # bind mount) -- caps each container's on-disk logs instead of leaving
    # json-file to grow unbounded. filebeat below tails these same files, so
    # 3x10m is buffer for it to catch up before docker rotates a segment out
    # from under it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # api and worker are separate builds from the same source/mangachan repo:
  # worker owns the Flyway migrations and runs the scheduled catalog-refresh
  # jobs (task-scheduling's JDBC lock manager means only one worker replica
  # runs a given job even if scaled out); api just serves the HTTP API and
  # expects the schema worker already migrated. Their EXPOSE'd ports differ
  # too (confirmed via `docker ps` on first deploy) -- api on 8880, worker
  # on 8881.
  api:
    image: registry.gitlab.com/tachiproxy/source/mangachan/api:develop
    restart: always
    env_file:
      - .env
    volumes:
      - ./ca.pem:/app/ca.pem:ro
    ports:
      - "8880:8880"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: registry.gitlab.com/tachiproxy/source/mangachan/worker:develop
    restart: always
    env_file:
      - .env
    volumes:
      - ./ca.pem:/app/ca.pem:ro
    ports:
      - "8881:8881"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ships postgres/api/worker's docker logs to Kibana on vm-elk (pillar
  # elk.host) as the filebeat_writer_mangachan user (salt/elk/app.sls). Runs
  # as root since /var/lib/docker/containers and docker.sock are root-owned;
  # the "container" autodiscover input below reads the same json-file logs
  # the logging: blocks above cap the size of.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    restart: always
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data:/usr/share/filebeat/data
    environment:
      - ELK_HOST=$ELK_HOST
      - ELK_FILEBEAT_PASSWORD=$ELK_FILEBEAT_PASSWORD
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume, but backed by a bind to the scsi1 data disk (disk.sls) so
# postgres's data lives off the template's 15gb root disk, which it filled.
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/tachiproxy-mangachan/postgres
  filebeat_data:
