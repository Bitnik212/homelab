services:
  bot:
    image: registry.gitlab.com/bitnik212/myreels-bot:latest
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    # 127.0.0.1 inside this container is its own loopback, not the VM's --
    # host-gateway resolves to the real VM interface, where nginx actually
    # listens for api.reels.bitt.app.
    extra_hosts:
      - "api.reels.bitt.app:host-gateway"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
